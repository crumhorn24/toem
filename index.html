<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Open-World Driving Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VEHICLE CLASS SELECTION INTERFACE -->
    <div id="menu-view" class="menu-view">
        <h1>Select Real Simulation Model</h1>
        <div class="menu-container">
            <button class="vehicle-btn" onclick="selectVehicle('Car')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="1.5"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                <div class="vehicle-text">Sedan Car</div>
            </button>
            <button class="vehicle-btn" onclick="selectVehicle('Lorry')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="1.5"><path d="M14 18H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h11v13zM14 9h4l3 3v5a1 1 0 0 1-1 1h-6V9z"/><circle cx="5.5" cy="18" r="1.5"/><circle cx="11.5" cy="18" r="1.5"/><circle cx="17.5" cy="18" r="1.5"/></svg>
                <div class="vehicle-text">Commercial Lorry</div>
            </button>
            <button class="vehicle-btn" onclick="selectVehicle('Motorcycle')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#39ff14" stroke-width="1.5"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M5 18l3-5h6l3 5M8 13l2-5h4l1 3"/></svg>
                <div class="vehicle-text">Motorcycle</div>
            </button>
            <button class="vehicle-btn" onclick="selectVehicle('Bus')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#ffaa00" stroke-width="1.5"><path d="M4 18h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2zM2 14h20M2 10h20M6 4v6M12 4v6M18 4v6"/><circle cx="6" cy="18" r="1.5"/><circle cx="18" cy="18" r="1.5"/></svg>
                <div class="vehicle-text">Transit Bus</div>
            </button>
        </div>
    </div>

    <!-- ACTION VIEWPORT WORLD GENERATOR -->
    <div id="game-viewport">
        
        <!-- Interactive Reflection Mirrors -->
        <div id="center-mirror" class="rear-mirror"><div id="reflect-center" class="mirror-reflection"></div></div>
        <div id="left-mirror" class="rear-mirror"><div id="reflect-left" class="mirror-reflection"></div></div>
        
        <button id="exit-car-btn" onclick="exitVehicleToggle()">Leave Vehicle</button>
        <div id="foot-view"></div>

        <!-- 3D Transform Render Layer -->
        <div id="world-container">
            <div id="world-3d-scene" style="transform-style: preserve-3d;"></div>
        </div>

        <!-- FIRST-PERSON INTEGRATED COCKPIT ASSEMBLY FRAME -->
        <div id="cockpit-frame">
            <div id="steering-assembly">
                <div id="physical-wheel"></div>
            </div>

            <!-- Integrated Dashboard telemetry metrics panel -->
            <div id="dashboard-panel">
                <div class="cluster-gauge">MODEL: <span id="gauge-type">-</span></div>
                <div class="cluster-gauge">SPEED: <span id="gauge-speed">0</span> KM/H</div>
                
                <!-- Interactive Radio console -->
                <div id="car-radio">
                    <div>📻 MEDIA PLAYER</div>
                    <div id="radio-display" style="font-weight:bold; margin-top:5px;">OFF</div>
                    <div style="font-size:0.65rem; color:#888; margin-top:3px;">Press 'R' to Tune</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Logic Module dependencies -->
    <script src="game.js"></script>
</body>
</html>
