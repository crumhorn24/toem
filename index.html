<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D First-Person Driving Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #080810; color: white; user-select: none; }
        
        /* Vehicle Selection Menu */
        #menu-view {
            position: absolute; width: 100vw; height: 100vh; z-index: 100;
            background: linear-gradient(135deg, #0f0f26, #040408);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,210,255,0.3); }
        .menu-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 85%; max-width: 900px; }
        .vehicle-btn {
            background: #14142b; border: 2px solid #2a2a44; border-radius: 12px; height: 160px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
            cursor: pointer; transition: all 0.2s ease; color: white; font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
        }
        .vehicle-btn:hover { transform: translateY(-5px); border-color: #00d2ff; background: #1c1c3d; }
        
        /* Game Screen Layout */
        #game-view { display: none; position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Dashboard UI Cluster Overlay */
        #dashboard-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 26vh;
            background: linear-gradient(to top, #06060a 85%, #181826 100%);
            border-top: 5px solid #252538; display: flex; align-items: center; justify-content: space-between;
            padding: 0 50px; box-sizing: border-box; z-index: 50;
        }
        .hud-panel { background: rgba(5,5,10,0.7); border: 2px solid #00d2ff; padding: 12px 25px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; min-width: 160px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #controls-hint { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.75); padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; color: #aaa; z-index: 50; border: 1px solid #252538; }
    </style>
</head>
<body>

    <!-- SELECTION MENU -->
    <div id="menu-view">
        <h1>Select Your Vehicle Model</h1>
        <div class="menu-container">
            <button class="vehicle-btn" onclick="launchGame('car')">🚗 Sedan Car</button>
            <button class="vehicle-btn" onclick="launchGame('lorry')">🚛 Heavy Lorry</button>
            <button class="vehicle-btn" onclick="launchGame('motorcycle')">🏍️ Motorcycle</button>
            <button class="vehicle-btn" onclick="launchGame('bus')">🚌 Transit Bus</button>
        </div>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-view">
        <div id="controls-hint">W/S: Accelerate/Brake & Reverse | A/D: Smooth Steer Wheels</div>
        <canvas id="renderCanvas"></canvas>
        
        <!-- DASHBOARD HUD -->
        <div id="dashboard-ui">
            <div class="hud-panel">
                GEAR MODEL: <span id="hud-model">-</span><br>
                STATUS: <span style="color: #39ff14;">DRIVING</span>
            </div>
            <div class="hud-panel" style="font-size: 1.5rem; text-align: center; border-color: #ff0055;">
                <span id="hud-speed">0</span><br><span style="font-size: 0.75rem; color: #666;">KM/H</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        
        let keys = { w:0, a:0, s:0, d:0 };
        let activeModel = '';
        let loopInterval;

        // --- PHYSICAL VEHICLE CONFIGURATION MATRIX ---
        let car = {
            x: 0, y: 1500,          // Position coordinates on map
            speed: 0,
            angle: 0,              // Vehicle heading rotation angle
            wheelAngle: 0,         // Axle steering direction wheel angle
            maxWheelAngle: 0.38,   // Reduced maximum turning threshold to limit sensitivity
            wheelbase: 4.8,        // Distance between axles
            width: 2.4,
            height: 1.5,
            color: '#00d2ff',
            seatX: -0.55           // Lock POV camera to the realistic left-hand side seat position
        };

        // --- OPEN WORLD ENVIRONMENTS MAP (A LOT BIGGER) ---
        let citySkyscrapers = [];
        let highwayTraffic = [];

        function resizeGameWindow() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.launchGame = function(type) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'block';
            document.getElementById('hud-model').innerText = type.toUpperCase();
            
            activeModel = type;
            // Scale chassis properties based on selected model
            if (type === 'lorry') { car.wheelbase = 11.5; car.width = 3.0; car.height = 3.8; car.color = '#ff007f'; }
            if (type === 'bus') { car.wheelbase = 13.5; car.width = 2.9; car.height = 3.4; car.color = '#ffaa00'; }
            if (type === 'motorcycle') { car.wheelbase = 2.2; car.width = 0.8; car.height = 1.1; car.color = '#39ff14'; car.seatX = 0; }

            resizeGameWindow();
            window.addEventListener('keydown', (e) => handleDrivingKeys(e, true));
            window.addEventListener('keyup', (e) => handleDrivingKeys(e, false));
            window.addEventListener('resize', resizeGameWindow);

            // A LOT BIGGER MAP: Populates a massive city grid map spanning 4,000 meters wide
            for (let x = -2000; x <= 2000; x += 300) {
                for (let y = 0; y <= 4000; y += 300) {
                    if (Math.abs(x) < 40) continue; // Clears area for main multi-lane highway avenues
                    
                    let randomizedHeight = 40 + Math.random() * 110;
                    citySkyscrapers.push({ x: x, y: y, z: 0, w: 40, l: 40, h: randomizedHeight });
                }
            }

            // Spawn separate traffic vehicles running matching dimensions
            for(let i = 0; i < 6; i++) {
                highwayTraffic.push({ x: 10, y: 300 + (i * 350), speed: 3.5, color: '#556677' });
            }

            loopInterval = setInterval(simulationEngineTick, 1000 / 60);
        };

        function handleDrivingKeys(e, isPressed) {
            let state = isPressed ? 1 : 0;
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = state;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = state;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = state;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = state;
        }

        function simulationEngineTick() {
            // 1. --- ACKERMANN STEERING FRONT WHEEL TURNING PHYSICS ---
            // Scaled turn increments back significantly to fix high sensitivity
            if (keys.a) car.wheelAngle = Math.max(-car.maxWheelAngle, car.wheelAngle - 0.012);
            else if (keys.d) car.wheelAngle = Math.min(car.maxWheelAngle, car.wheelAngle + 0.012);
            else car.wheelAngle *= 0.8; // Front wheels spring back straight smoothly on release

            if (keys.w) car.speed += 0.22;
            else if (keys.s) car.speed -= 0.5;
            else car.speed *= 0.96;
            car.speed = Math.max(-6, Math.min(car.speed, 120));

            // Track individual front and rear axles paths independently 
            let fx = car.x + (car.wheelbase / 2) * Math.sin(car.angle);
            let fy = car.y - (car.wheelbase / 2) * Math.cos(car.angle);
            let rx = car.x - (car.wheelbase / 2) * Math.sin(car.angle);
            let ry = car.y + (car.wheelbase / 2) * Math.cos(car.angle);

            // Turn vectors
            rx += car.speed * 0.035 * Math.sin(car.angle);
            ry -= car.speed * 0.035 * Math.cos(car.angle);

            fx += car.speed * 0.035 * Math.sin(car.angle + car.wheelAngle);
            fy -= car.speed * 0.035 * Math.cos(car.angle + car.wheelAngle);

            // Re-map car position and heading angles from separated tires trajectories
            car.x = (fx + rx) / 2;
            car.y = (fy + ry) / 2;
            car.angle = Math.atan2(fx - rx, ry - fy);

            // Run computer traffic loops
            highwayTraffic.forEach(npc => {
                npc.y += npc.speed * 0.35;
                if (npc.y > car.y + 700) npc.y = car.y - 700;
            });

            // 2. --- UNBLOCKABLE HARDWARE-ACCELERATED 3D PROJECTION SYSTEM ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let horizonY = canvas.height * 0.38;
            let cx = canvas.width / 2;
            let cameraFov = 450; // Visual zoom factor

            ctx.fillStyle = '#2c4222'; // Grass ground level field
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);
            ctx.fillStyle = '#7ec1eb'; // Blue daylight sky plane
            ctx.fillRect(0, 0, canvas.width, horizonY);

            // --- FIRST PERSON MATRICES: CAMERA FIXED IN DRIVER'S EYE SOCKETS ---
            function projectToFirstPerson3D(worldX, worldY, worldZ) {
                // Displaces viewpoint directly onto left-side cabin seating parameters
                let eyeOffsetX = Math.sin(car.angle) * car.seatX;
                let eyeOffsetY = Math.cos(car.angle) * car.seatX;
                
                let relX = worldX - (car.x + eyeOffsetX);
                let relY = worldY - (car.y + eyeOffsetY);

                // Rotate surrounding world layout around your eye vector direction angles
                let rotX = relX * Math.cos(-car.angle) - relY * Math.sin(-car.angle);
                let rotY = relX * Math.sin(-car.angle) + relY * Math.cos(-car.angle);

                if (rotY >= -0.3) return null; // Behind camera clipping loop

                let scale = cameraFov / -rotY;
                
                // FIX: Added "+ car.height * 0.75" factor to ground calculations. 
                // This guarantees camera height stays perfectly at low seat eye level and never slips under the map floor!
                return {
                    x: cx + rotX * scale,
                    y: horizonY + (worldZ - car.height * 0.75) * scale, 
                    sz: scale
                };
            }

            // Draw Highway Asphalt Strip
            ctx.fillStyle = '#202022';
            ctx.beginPath();
            let lf = projectToFirstPerson3D(-25, car.y - 1500, 0);
            let rf = projectToFirstPerson3D(25, car.y - 1500, 0);
            let rn = projectToFirstPerson3D(25, car.y + 50, 0);
            let ln = projectToFirstPerson3D(-25, car.y + 50, 0);

            if (lf && rf && rn && ln) {
                ctx.moveTo(lf.x, lf.y); ctx.lineTo(rf.x, rf.y); ctx.lineTo(rn.x, rn.y); ctx.lineTo(ln.x, ln.y);
                ctx.fill();
            }

            // Draw Painted Yellow Road Markings
            ctx.fillStyle = '#ffaa00';
            for (let lineY = Math.floor(car.y - 1200); lineY < car.y + 200; lineY += 90) {
                let centerDash = projectToFirstPerson3D(0, lineY, 0);
                if (centerDash) ctx.fillRect(centerDash.x - centerDash.sz * 0.1, centerDash.y, centerDash.sz * 0.25, centerDash.sz * 6);
            }

            // Draw Massive Open Landscape City Skyscraper Blocks
            citySkyscrapers.forEach(b => {
                if (Math.abs(b.y - car.y) > 1500) return; // Cull distant structures for execution efficiency

                let bBase = projectToFirstPerson3D(b.x, b.y, 0);
                if (bBase) {
                    let w = b.w * bBase.sz;
                    let h = b.h * bBase.sz;
                    
                    ctx.fillStyle = '#546e7a'; // Solid block structural shade
                    ctx.fillRect(bBase.x - w/2, bBase.y - h, w, h);
                    ctx.strokeStyle = '#37474f';
                    ctx.strokeRect(bBase.x - w/2, bBase.y - h, w, h);
                }
            });

            // Draw Traffic Obstacles matching matching player size properties
            highwayTraffic.forEach(npc => {
                let p = projectToFirstPerson3D(npc.x, npc.y, 0);
                if (p) {
                    let w = car.width * p.sz;
                    let h = car.height * p.sz;
                    ctx.fillStyle = npc.color;
                    ctx.fillRect(p.x - w / 2, p.y - h, w, h);
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.25)'; // Glass cabin windscreen
                    ctx.fillRect(p.x - w / 2 + 4, p.y - h + 2, w - 8, h * 0.22);
                }
            });

            // Render Separate Left-Hand Interior Turning Steering Wheel 
            if (activeModel !== 'motorcycle') {
                ctx.save();
                ctx.translate(cx - 220, canvas.height * 0.66); // Locks console steering assembly straight onto left driver column axis
                ctx.rotate(car.wheelAngle * 2.6);              // Steering ring rotates visibly further than tyres!
                
                ctx.lineWidth = 18;
                ctx.strokeStyle = '#1d1d24';
                ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.stroke();
                
                ctx.fillStyle = '#15151c';
                ctx.fillRect(-80, -6, 160, 12);
                ctx.fillRect(-6, 0, 12, 80);
                ctx.restore();
            }

            document.getElementById('hud-speed').innerText = Math.round(Math.abs(car.speed));
        }
    </script>
</body>
</html>
