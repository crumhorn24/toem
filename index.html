<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Game Menu</title>
    <style>
        /* Base styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* Menu View Style (Dark Mode) */
        .menu-view {
            background: linear-gradient(135deg, #1e1e2f, #111119);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1100px;
            padding: 20px;
        }

        .vehicle-btn {
            background: #2a2a40;
            border: 2px solid #3f3f5f;
            border-radius: 16px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .vehicle-btn:hover {
            transform: translateY(-10px);
            background: #343452;
            border-color: #00d2ff;
            box-shadow: 0 12px 24px rgba(0, 210, 255, 0.2);
        }

        .image-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .vehicle-svg {
            width: 80%;
            height: auto;
            max-height: 120px;
        }

        .vehicle-text {
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            margin-top: 15px;
            width: 100%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        /* Game Screen View Style (Blank White Mode) */
        .game-view {
            display: none; /* Hidden by default */
            background: #ffffff;
            color: #111119;
            min-height: 100vh;
            position: relative; /* Needed to lock button to bottom left */
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            box-sizing: border-box;
        }

        #game-title {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Red Back Button Style at Bottom Left */
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 51, 51, 0.3);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background-color: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(255, 51, 51, 0.5);
        }
    </style>
</head>
<body>

    <!-- SECTION 1: THE MENU VIEW -->
    <div id="menu-view" class="menu-view">
        <h1>Select Your Vehicle</h1>

        <div class="menu-container">
            <!-- CAR BUTTON -->
            <button class="vehicle-btn" onclick="startGame('Car')">
                <div class="image-wrapper">
                    <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
                        <circle cx="7" cy="17" r="2" fill="#1e1e2f" />
                        <circle cx="17" cy="17" r="2" fill="#1e1e2f" />
                        <path d="M7 17h10" />
                    </svg>
                </div>
                <div class="vehicle-text">Car</div>
            </button>

            <!-- LORRY BUTTON -->
            <button class="vehicle-btn" onclick="startGame('Lorry')">
                <div class="image-wrapper">
                    <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 18H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h11v13z" />
                        <path d="M14 9h4l3 3v5a1 1 0 0 1-1 1h-6V9z" />
                        <circle cx="5.5" cy="18" r="1.5" fill="#1e1e2f" />
                        <circle cx="11.5" cy="18" r="1.5" fill="#1e1e2f" />
                        <circle cx="17.5" cy="18" r="1.5" fill="#1e1e2f" />
                    </svg>
                </div>
                <div class="vehicle-text">Lorry</div>
            </button>

            <!-- MOTORCYCLE BUTTON -->
            <button class="vehicle-btn" onclick="startGame('Motorcycle')">
                <div class="image-wrapper">
                    <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#39ff14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="5" cy="18" r="2.5" />
                        <circle cx="19" cy="18" r="2.5" />
                        <path d="M5 18l3-5h6l3 5" />
                        <path d="M8 13l2-5h4l1 3" />
                        <path d="M14 8h-3" />
                    </svg>
                </div>
                <div class="vehicle-text">Motorcycle</div>
            </button>

            <!-- BUS BUTTON -->
            <button class="vehicle-btn" onclick="startGame('Bus')">
                <div class="image-wrapper">
                    <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 18h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z" />
                        <path d="M2 14h20" />
                        <path d="M2 10h20" />
                        <path d="M6 4v6" />
                        <path d="M12 4v6" />
                        <path d="M18 4v6" />
                        <circle cx="6" cy="18" r="1.5" fill="#1e1e2f" />
                        <circle cx="18" cy="18" r="1.5" fill="#1e1e2f" />
                    </svg>
                </div>
                <div class="vehicle-text">Bus</div>
            </button>
        </div>
    </div>

    <!-- SECTION 2: THE BLANK WHITE GAME VIEW -->
    <div id="game-view" class="game-view">
        <h1 id="game-title">Vehicle Name Here</h1>
        
        <!-- RED BACK BUTTON -->
        <button class="back-btn" onclick="showMenu()">Back to Menu</button>
    </div>

    <script>
        // Shows the white game view and hides the menu
        function startGame(vehicleType) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('game-title').innerText = vehicleType;
            document.getElementById('game-view').style.display = 'flex';
        }

        // Hides the game view and brings back the menu
        function showMenu() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
        }
    </script>

</body>
</html>
