<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Level 3D Open World Driving Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #050508; user-select: none; }
        
        /* Selection Menu UI */
        #menu-view {
            position: absolute; width: 100vw; height: 100vh; z-index: 100;
            background: linear-gradient(135deg, #0d0d19, #040407);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,210,255,0.3); }
        .menu-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 85%; max-width: 900px; }
        .vehicle-btn {
            background: #141426; border: 2px solid #2a2a44; border-radius: 12px; height: 180px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
            cursor: pointer; transition: all 0.2s ease; color: white; font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
        }
        .vehicle-btn:hover { transform: translateY(-6px); border-color: #00d2ff; background: #1c1c38; box-shadow: 0 5px 15px rgba(0,210,255,0.2); }
        
        /* 3D Container Viewport */
        #canvas-container { width: 100vw; height: 100vh; display: none; }
        
        /* Dashboard HUD */
        #hud {
            position: absolute; bottom: 25px; left: 25px; background: rgba(10,10,15,0.85);
            border: 2px solid #ff0055; padding: 12px 25px; border-radius: 8px; color: #fff;
            font-family: monospace; font-size: 1.3rem; font-weight: bold; z-index: 50;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #controls-hint { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; color: #bbb; z-index: 50; }
    </style>
    
    <!-- FIX: Points directly to your unblockable local engine file instead of a CDN -->
    <script src="three.js"></script>
</head>
<body>

    <!-- VEHICLE SELECTION MENU -->
    <div id="menu-view">
        <h1>Select Your Vehicle Model</h1>
        <div class="menu-container">
            <button class="vehicle-btn" onclick="initSimulation('car')">🚗 Sedan Car</button>
            <button class="vehicle-btn" onclick="initSimulation('lorry')">🚛 Heavy Lorry</button>
            <button class="vehicle-btn" onclick="initSimulation('motorcycle')">🏍️ Motorcycle</button>
            <button class="vehicle-btn" onclick="initSimulation('bus')">🚌 Transit Bus</button>
        </div>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="controls-hint">W/S: Throttle/Brake | A/D: Turn Front Wheels Smoothly</div>
    <div id="canvas-container"></div>
    <div id="hud">SPEED: <span id="hud-speed">0</span> KM/H</div>

    <script>
        let scene, camera, renderer;
        let keys = { w:0, a:0, s:0, d:0 };
        let speed = 0, turnAngle = 0;
        
        let vehicleGroup, steeringWheelMesh, leftFrontWheel, rightFrontWheel;
        let npcCars = [];
        let driverGroup;

        let config = {
            car: { width: 2.6, height: 1.6, length: 5.5, seatX: -0.6, seatY: 0.9, seatZ: 0.2, color: 0x00d2ff },
            lorry: { width: 3.2, height: 4.2, length: 14.0, seatX: -0.9, seatY: 2.4, seatZ: 4.2, color: 0xff007f },
            motorcycle: { width: 0.8, height: 1.2, length: 2.4, seatX: 0.0, seatY: 0.9, seatZ: -0.2, color: 0x39ff14 },
            bus: { width: 3.0, height: 3.6, length: 16.0, seatX: -0.8, seatY: 2.0, seatZ: 5.5, color: 0xffaa00 }
        };

        window.initSimulation = function(type) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';
            setup3DEngine(type);
        };

        function setup3DEngine(type) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaccff);
            scene.fog = new THREE.FogExp2(0xaaccff, 0.005);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            // Checks for compatibility between WebGL and your downloaded engine version
            if (typeof THREE.WebGLRenderer !== 'undefined') {
                renderer = new THREE.WebGLRenderer({ antialias: true });
            } else {
                renderer = new THREE.WebGPURenderer({ antialias: true });
            }
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const sun = new THREE.DirectionalLight(0xffffff, 1.4);
            sun.position.set(200, 400, 200);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));

            buildMassiveCityGrid();
            assembleVehicleEntity(type);
            assembleDriverPerson(type);
            spawnNPCTraffic(type);

            window.addEventListener('keydown', (e) => handleInput(e, true));
            window.addEventListener('keyup', (e) => handleInput(e, false));
            window.addEventListener('resize', onWindowResize);

            animateFrameLoop();
        }

        function buildMassiveCityGrid() {
            // Massive 4000x4000 meter map plane
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x3d5c2e }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222225 });
            const h1 = new THREE.Mesh(new THREE.PlaneGeometry(60, 4000), roadMat);
            h1.rotation.x = -Math.PI / 2; h1.position.y = 0.02; scene.add(h1);

            for (let zPos = -1500; zPos <= 1500; zPos += 1000) {
                const h2 = new THREE.Mesh(new THREE.PlaneGeometry(4000, 40), roadMat);
                h2.rotation.x = -Math.PI / 2; h2.position.set(0, 0.03, zPos); scene.add(h2);
            }

            const buildMat = new THREE.MeshStandardMaterial({ color: 0x78909c });
            for(let x = -1500; x <= 1500; x += 300) {
                for(let z = -1500; z <= 1500; z += 300) {
                    if (Math.abs(x) < 60 && Math.abs(z % 1000) < 60) continue;
                    let h = 40 + Math.random() * 120;
                    let building = new THREE.Mesh(new THREE.BoxGeometry(40, h, 40), buildMat);
                    building.position.set(x, h/2, z);
                    scene.add(building);
                }
            }
        }

        function assembleVehicleEntity(type) {
            vehicleGroup = new THREE.Group();
            let v = config[type];

            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(v.width, v.height, v.length), new THREE.MeshStandardMaterial({ color: v.color }));
            bodyMesh.position.y = v.height / 2 + 0.4;
            vehicleGroup.add(bodyMesh);

            if (type !== 'motorcycle') {
                const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(v.width - 0.1, v.height * 0.4, v.length * 0.3), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
                windowMesh.position.set(0, v.height * 0.8, v.length * 0.25);
                vehicleGroup.add(windowMesh);
            }

            const seatMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x111115 }));
            seatMesh.position.set(v.seatX, 0.6, v.seatZ);
            vehicleGroup.add(seatMesh);

            if (type !== 'motorcycle') {
                steeringWheelMesh = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.03, 6, 16), new THREE.MeshStandardMaterial({ color: 0x222225 }));
                steeringWheelMesh.position.set(v.seatX, v.height * 0.72, v.seatZ + v.length * 0.15);
                steeringWheelMesh.rotation.x = -Math.PI / 4;
                vehicleGroup.add(steeringWheelMesh);
            }

            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            leftFrontWheel = new THREE.Mesh(wheelGeo, wheelMat);
            leftFrontWheel.position.set(-v.width/2 - 0.1, 0.4, v.length * 0.35);
            vehicleGroup.add(leftFrontWheel);

            rightFrontWheel = new THREE.Mesh(wheelGeo, wheelMat);
            rightFrontWheel.position.set(v.width/2 + 0.1, 0.4, v.length * 0.35);
            vehicleGroup.add(rightFrontWheel);

            vehicleGroup.position.set(0, 0, 2000); // Spawns safely on the edge of the massive grid map
            scene.add(vehicleGroup);
        }

        function assembleDriverPerson(type) {
            driverGroup = new THREE.Group();
            let v = config[type];

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.4), new THREE.MeshStandardMaterial({ color: 0x3f51b5 }));
            torso.position.y = 0.3; driverGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 0.75; driverGroup.add(head);

            const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.04), new THREE.MeshStandardMaterial({ color: 0x000000 }));
            leftEye.position.set(-0.08, 0.8, 0.16); driverGroup.add(leftEye);

            const armGeo = new THREE.BoxGeometry(0.12, 0.12, 0.5);
            const leftArm = new THREE.Mesh(armGeo, new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            leftArm.position.set(-0.25, 0.4, 0.25); driverGroup.add(leftArm);

            driverGroup.position.set(v.seatX, v.seatY - 0.5, v.seatZ);
            vehicleGroup.add(driverGroup);
        }

        function spawnNPCTraffic(playerType) {
            let v = config[playerType];
            for(let i = 0; i < 6; i++) {
                let npc = new THREE.Mesh(new THREE.BoxGeometry(v.width, v.height, v.length), new THREE.MeshStandardMaterial({ color: 0x555566 }));
                npc.position.set(15, v.height/2 + 0.4, -300 - (i * 250));
                scene.add(npc); npcCars.push(npc);
            }
        }

        function handleInput(e, isDown) {
            const state = isDown ? 1 : 0;
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = state;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = state;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = state;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = state;
        }

        function animateFrameLoop() {
            requestAnimationFrame(animateFrameLoop);

            if (keys.w) speed += 0.25;
            else if (keys.s) speed -= 0.45;
            else speed *= 0.96;
            speed = Math.max(-8, Math.min(speed, 110));

            if (keys.a) { 
                turnAngle += 0.005 * (speed / 40); 
                if (steeringWheelMesh) steeringWheelMesh.rotation.z = 0.8;
                leftFrontWheel.rotation.y = 0.4; rightFrontWheel.rotation.y = 0.4;
            }
            else if (keys.d) { 
                turnAngle -= 0.005 * (speed / 40); 
                if (steeringWheelMesh) steeringWheelMesh.rotation.z = -0.8;
                leftFrontWheel.rotation.y = -0.4; rightFrontWheel.rotation.y = -0.4;
            }
            else { 
                if (steeringWheelMesh) steeringWheelMesh.rotation.z *= 0.8;
                leftFrontWheel.rotation.y *= 0.8; rightFrontWheel.rotation.y *= 0.8;
            }

            vehicleGroup.position.z -= Math.cos(turnAngle) * (speed * 0.02);
            vehicleGroup.position.x -= Math.sin(turnAngle) * (speed * 0.02);
            vehicleGroup.rotation.y = turnAngle;

            // Target camera positioning right in character eye sockets
            let targetEyeVector = new THREE.Vector3(0, 0.8, 0.16); 
            driverGroup.localToWorld(targetEyeVector); 
            camera.position.copy(targetEyeVector); 

            let lookTarget = new THREE.Vector3(0, 0.8, 20); 
            driverGroup.localToWorld(lookTarget);
            camera.lookAt(lookTarget);

            npcCars.forEach(npc => {
                npc.position.z += 0.5;
                if(npc.position.z > 2000) npc.position.z = -2000;
            });

            document.getElementById('hud-speed').innerText = Math.round(Math.abs(speed));
            if (renderer) renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
