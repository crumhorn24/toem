<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Driving Simulation</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111119; }
        
        /* Selection Menu Styling */
        #menu-view {
            position: absolute; width: 100%; height: 100%; z-index: 10;
            background: linear-gradient(135deg, #1e1e2f, #111119);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        h1 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        .menu-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 85%; max-width: 1000px; }
        .vehicle-btn {
            background: #2a2a40; border: 2px solid #3f3f5f; border-radius: 16px; height: 250px;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 20px; cursor: pointer; transition: all 0.3s ease;
        }
        .vehicle-btn:hover { transform: translateY(-8px); border-color: #00d2ff; background: #343452; }
        .vehicle-svg { width: 70%; height: auto; max-height: 100px; }
        .vehicle-text { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; color: white; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; text-align: center; padding-top: 10px; }
        
        /* 3D Gameplay Elements */
        #canvas-container { width: 100%; height: 100vh; display: none; }
        #hud {
            position: absolute; top: 20px; left: 20px; color: white; font-weight: bold;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; display: none; pointer-events: none;
        }
        #controls-hint { position: absolute; bottom: 20px; right: 20px; color: #aaa; font-size: 0.9rem; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; display: none; }
    </style>
    
    <!-- Production-Ready Three.js Script -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- VEHICLE SELECTION MENU -->
    <div id="menu-view">
        <h1 id="menu-title">Loading 3D Engine...</h1>
        <div class="menu-container" id="menu-box" style="opacity: 0.3; pointer-events: none;">
            <button class="vehicle-btn" onclick="initGame('Car')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="1.5"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
                <div class="vehicle-text">Car</div>
            </button>
            <button class="vehicle-btn" onclick="initGame('Lorry')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="1.5"><path d="M14 18H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h11v13zM14 9h4l3 3v5a1 1 0 0 1-1 1h-6V9z"/><circle cx="5.5" cy="18" r="1.5"/><circle cx="11.5" cy="18" r="1.5"/><circle cx="17.5" cy="18" r="1.5"/></svg>
                <div class="vehicle-text">Lorry</div>
            </button>
            <button class="vehicle-btn" onclick="initGame('Motorcycle')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#39ff14" stroke-width="1.5"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M5 18l3-5h6l3 5M8 13l2-5h4l1 3"/></svg>
                <div class="vehicle-text">Motorcycle</div>
            </button>
            <button class="vehicle-btn" onclick="initGame('Bus')">
                <svg class="vehicle-svg" viewBox="0 0 24 24" fill="none" stroke="#ffaa00" stroke-width="1.5"><path d="M4 18h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2zM2 14h20M2 10h20M6 4v6M12 4v6M18 4v6"/><circle cx="6" cy="18" r="1.5"/><circle cx="18" cy="18" r="1.5"/></svg>
                <div class="vehicle-text">Bus</div>
            </button>
        </div>
    </div>

    <!-- 3D GRAPHICS CONTAINER -->
    <div id="canvas-container"></div>

    <!-- GAMEPLAY INTERFACE -->
    <div id="hud">
        Vehicle: <span id="hud-type">-</span><br>
        Speed: <span id="hud-speed">0</span> KM/H<br>
        Indicator: <span id="hud-signal">OFF</span>
    </div>
    <div id="controls-hint">Use WASD or Arrows to drive. Q/E for Indicators. Space to brake.</div>

    <!-- GAME ENGINE LOGIC -->
    <script>
        let scene, camera, renderer, playerCar, steeringWheel;
        let keys = { w:0, a:0, s:0, d:0, q:0, e:0 };
        let speed = 0, turnAngle = 0;
        let npcCars = [], pedestrians = [];
        let audioCtx;

        // Unlock menu interface when background files load completely
        window.addEventListener('load', () => {
            if (typeof THREE !== 'undefined') {
                document.getElementById('menu-title').innerText = "Select Your Vehicle";
                document.getElementById('menu-box').style.opacity = "1";
                document.getElementById('menu-box').style.pointerEvents = "auto";
            } else {
                document.getElementById('menu-title').innerText = "Engine Load Failure. Refresh Page.";
            }
        });

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        window.initGame = function(selectedType) {
            initAudio();
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('canvas-container').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hint').style.display = 'block';
            document.getElementById('hud-type').innerText = selectedType;

            setup3DWorld(selectedType);
        };

        function setup3DWorld(type) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaccff);
            scene.fog = new THREE.FogExp2(0xaaccff, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Strong directional sun lighting to make models visible
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            createCityLayout();
            createPlayerVehicle(type);
            spawnTraffic();
            spawnPedestrians();

            window.addEventListener('keydown', (e) => handleInput(e, true));
            window.addEventListener('keyup', (e) => handleInput(e, false));
            window.addEventListener('resize', onWindowResize);

            animateLoop();
        }

        function createCityLayout() {
            const floorGeo = new THREE.PlaneGeometry(2000, 2000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x557a46 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const mainStreet = new THREE.Mesh(new THREE.PlaneGeometry(40, 2000), roadMat);
            mainStreet.rotation.x = -Math.PI / 2;
            mainStreet.position.y = 0.02;
            mainStreet.receiveShadow = true;
            scene.add(mainStreet);

            const buildGeo = new THREE.BoxGeometry(25, 50, 25);
            const buildMat = new THREE.MeshStandardMaterial({ color: 0xb0bec5 });
            for(let i = -800; i < 800; i += 100) {
                if (Math.abs(i) < 50) continue;
                let b1 = new THREE.Mesh(buildGeo, buildMat);
                b1.position.set(-45, 25, i);
                b1.castShadow = true;
                scene.add(b1);

                let b2 = new THREE.Mesh(buildGeo, buildMat);
                b2.position.set(45, 25, i);
                b2.castShadow = true;
                scene.add(b2);
            }

            const crossMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for(let step = -16; step <= 16; step += 4) {
                let stripe = new THREE.Mesh(new THREE.PlaneGeometry(2, 12), crossMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(step, 0.03, 100);
                scene.add(stripe);
            }
        }

        function createPlayerVehicle(type) {
            playerCar = new THREE.Group();

            let w = 3, h = 2, l = 6, color = 0x00d2ff;
            if(type === 'Lorry') { h = 4.5; l = 14; color = 0xff007f; }
            if(type === 'Bus') { h = 4; l = 16; color = 0xffaa00; }
            if(type === 'Motorcycle') { w = 1; h = 1.4; l = 2.5; color = 0x39ff14; }

            const bodyGeo = new THREE.BoxGeometry(w, h, l);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = h/2 + 0.5;
            bodyMesh.castShadow = true;
            playerCar.add(bodyMesh);

            const wheelGeo = new THREE.TorusGeometry(0.35, 0.08, 8, 24);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
            steeringWheel = new THREE.Mesh(wheelGeo, wheelMat);
            steeringWheel.position.set(w * 0.25, h * 0.75, l * 0.2);
            playerCar.add(steeringWheel);

            playerCar.position.set(0, 0, 0);
            scene.add(playerCar);
        }

        function spawnTraffic() {
            const npcMat = new THREE.MeshStandardMaterial({ color: 0x78909c });
            const npcGeo = new THREE.BoxGeometry(3, 2, 6);
            for(let i = 0; i < 5; i++) {
                let npc = new THREE.Mesh(npcGeo, npcMat);
                npc.position.set(8, 1.5, -200 - (i * 120));
                scene.add(npc);
                npcCars.push(npc);
            }
        }

        function spawnPedestrians() {
            const pedGeo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
            const pedMat = new THREE.MeshStandardMaterial({ color: 0xff7043 });
            let ped = new THREE.Mesh(pedGeo, pedMat);
            ped.position.set(-18, 1.25, 100);
            scene.add(ped);
            pedestrians.push({ mesh: ped, dir: 1, state: 'walking' });
        }

        function handleInput(e, isDown) {
            const state = isDown ? 1 : 0;
            if(e.key === 'w' || e.key === 'ArrowUp') keys.w = state;
            if(e.key === 's' || e.key === 'ArrowDown') keys.s = state;
            if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = state;
            if(e.key === 'd' || e.key === 'ArrowRight') keys.d = state;
            
            if(isDown && (e.key === 'q' || e.key === 'e')) {
                playIndicatorClick();
                document.getElementById('hud-signal').innerText = e.key.toUpperCase() + ' - BLINKING';
            }
        }

        function playIndicatorClick() {
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        }

        function playHonkSound() {
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            if (keys.w) speed += 0.5;
            else if (keys.s) speed -= 0.8;
            else speed *= 0.95;

            speed = Math.max(-20, Math.min(speed, 140));

            if (keys.a) { turnAngle += 0.02; steeringWheel.rotation.z = 1.2; }
            else if (keys.d) { turnAngle -= 0.02; steeringWheel.rotation.z = -1.2; }
            else { steeringWheel.rotation.z *= 0.8; }

            playerCar.position.z -= Math.cos(turnAngle) * (speed * 0.01);
            playerCar.position.x -= Math.sin(turnAngle) * (speed * 0.01);
            playerCar.rotation.y = turnAngle;

            camera.position.set(
                playerCar.position.x + Math.sin(turnAngle) * 15,
                playerCar.position.y + 7,
                playerCar.position.z + Math.cos(turnAngle) * 15
            );
            camera.lookAt(playerCar.position.x, playerCar.position.y + 1.5, playerCar.position.z);

            npcCars.forEach(npc => {
                npc.position.z += 0.6;
                if(npc.position.z > 800) npc.position.z = -800;

                let dist = playerCar.position.distanceTo(npc.position);
                if (dist < 15) {
                    playHonkSound();
                }
            });

            pedestrians.forEach(ped => {
                if(ped.state === 'walking') {
                    ped.mesh.position.x += 0.08 * ped.dir;
                    if(Math.abs(ped.mesh.position.x) > 18) ped.dir *= -1;

                    if(playerCar.position.distanceTo(ped.mesh.position) < 4) {
                        ped.state = 'ragdoll';
                        ped.mesh.rotation.z = Math.PI / 2;
                        ped.mesh.position.y = 0.2;
                    }
                } else if(ped.state === 'ragdoll') {
                    ped.mesh.position.z -= 0.8;
                }
            });

            document.getElementById('hud-speed').innerText = Math.round(Math.abs(speed));
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
