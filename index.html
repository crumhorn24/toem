<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Open World Driving Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: white; user-select: none; }
        #menu-view {
            position: absolute; width: 100vw; height: 100vh; z-index: 100;
            background: linear-gradient(135deg, #121225, #05050a);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .menu-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 85%; max-width: 900px; }
        .vehicle-btn {
            background: #181835; border: 2px solid #2d2d54; border-radius: 12px; height: 160px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
            cursor: pointer; transition: all 0.2s ease; color: white; font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
        }
        .vehicle-btn:hover { transform: translateY(-5px); border-color: #00d2ff; background: #22224d; }
        #game-view { display: none; position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Dashboard UI HUD */
        #dashboard-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 26vh;
            background: linear-gradient(to top, #050508 85%, #151522 100%);
            border-top: 5px solid #2d2d40; display: flex; align-items: center; justify-content: space-between;
            padding: 0 50px; box-sizing: border-box; z-index: 50;
        }
        .hud-panel { background: rgba(5,5,10,0.8); border: 2px solid #00d2ff; padding: 12px 25px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; min-width: 160px; }
        
        /* Functional Rear-View Mirror Overlay */
        #rear-view-mirror {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 260px; height: 65px; background: #111; border: 4px solid #333;
            border-radius: 4px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- VEHICLE SELECTION MENU -->
    <div id="menu-view">
        <h1 style="text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px;">Select Simulation Model</h1>
        <div class="menu-container">
            <button class="vehicle-btn" onclick="launchSimulation('car')">🚗 Sedan Car</button>
            <button class="vehicle-btn" onclick="launchSimulation('lorry')">0 Heavy Lorry</button>
            <button class="vehicle-btn" onclick="soundBeep(); launchSimulation('motorcycle')">🏍️ Motorcycle</button>
            <button class="vehicle-btn" onclick="launchSimulation('bus')">🚌 Transit Bus</button>
        </div>
    </div>

    <!-- MAIN GAME SIMULATION -->
    <div id="game-view">
        <!-- Rear view mirror assembly -->
        <div id="rear-view-mirror"><canvas id="mirrorCanvas" style="width:100%; height:100%;"></canvas></div>
        
        <canvas id="renderCanvas"></canvas>
        
        <div id="dashboard-ui">
            <div class="hud-panel">
                MODEL: <span id="hud-model">-</span><br>
                RADIO: <span style="color: #9c27b0;">RADIO WAVE FM</span>
            </div>
            <div class="hud-panel" style="font-size: 1.5rem; text-align: center; border-color: #ff0055;">
                <span id="hud-speed">0</span><br><span style="font-size: 0.75rem; color: #555;">KM/H</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const mirrorCanvas = document.getElementById('mirrorCanvas');
        const mCtx = mirrorCanvas.getContext('2d');
        
        let keys = { w:0, a:0, s:0, d:0 };
        let activeModel = '';
        let loop;

        // --- SEPARATE KINEMATIC VEHICLE PROPERTIES ---
        let car = {
            x: 2000, y: 2000,     // Spawns dead centre on a massive grid
            speed: 0,
            angle: 0,             // Direction body is pointing
            wheelAngle: 0,        // Direction front tires are pointing
            maxWheelAngle: 0.35,  // Real-world steering lock
            wheelbase: 4.5,
            width: 2.4,
            height: 1.5,
            color: '#00d2ff',
            seatX: -0.6,          // Places camera on the realistic left-hand driver seat
            eyeHeight: 1.1        // Raised eye height so you are never under the map!
        };

        // --- A LOT BIGGER MAP CONFIGURATION (4000x4000 World Space Grid) ---
        let mapSize = 4000;
        let roads = [
            // Vertical main strip lanes
            { x: 1900, y: 0, w: 200, h: 4000 },
            // Horizontal crossroads forming sharp turn intersections and corners
            { x: 0, y: 1900, w: 4000, h: 200 },
            // Loop tracks forming twisting layouts
            { x: 800, y: 800, w: 2400, h: 100 },
            { x: 800, y: 800, w: 100, h: 2400 }
        ];

        let buildings = [];
        let traffic = [];

        function resizeWorld() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mirrorCanvas.width = 260;
            mirrorCanvas.height = 65;
        }

        window.launchSimulation = function(type) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'block';
            document.getElementById('hud-model').innerText = type.toUpperCase();
            
            activeModel = type;
            if (type === 'lorry') { car.wheelbase = 11.0; car.width = 3.0; car.height = 3.8; car.color = '#ff007f'; car.eyeHeight = 2.8; }
            if (type === 'bus') { car.wheelbase = 13.0; car.width = 2.9; car.height = 3.4; car.color = '#ffaa00'; car.eyeHeight = 2.4; }
            if (type === 'motorcycle') { car.wheelbase = 2.2; car.width = 0.8; car.height = 1.1; car.color = '#39ff14'; car.seatX = 0; car.eyeHeight = 0.9; }

            resizeWorld();
            window.addEventListener('keydown', (e) => handleInput(e, true));
            window.addEventListener('keyup', (e) => handleInput(e, false));
            window.addEventListener('resize', resizeWorld);

            // Populate massive grid map with block skyscraper volumes
            for (let i = 0; i < 150; i++) {
                buildings.push({
                    x: Math.random() * mapSize,
                    y: Math.random() * mapSize,
                    w: 40 + Math.random() * 60,
                    h: 40 + Math.random() * 60,
                    alt: 50 + Math.random() * 150
                });
            }

            // Spawn traffic patterns running parallel
            for (let i = 0; i < 8; i++) {
                traffic.push({ x: 1950 + (i%2 * 40), y: Math.random() * mapSize, speed: 3 + Math.random()*2, color: '#55667a' });
            }

            loop = setInterval(gameTickUpdate, 1000 / 60);
        };

        function handleInput(e, isDown) {
            let val = isDown ? 1 : 0;
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = val;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = val;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = val;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = val;
        }

        function gameTickUpdate() {
            // 1. --- REAL LIFE FRONT-WHEEL STEERING PHYSICS (Ackermann Axle Tracking) ---
            if (keys.a) car.wheelAngle = Math.max(-car.maxWheelAngle, car.wheelAngle - 0.015);
            else if (keys.d) car.wheelAngle = Math.min(car.maxWheelAngle, car.wheelAngle + 0.015);
            else car.wheelAngle *= 0.8; // Tires physically track straight when letting go

            if (keys.w) car.speed += 0.25;
            else if (keys.s) car.speed -= 0.5;
            else car.speed *= 0.96;
            car.speed = Math.max(-8, Math.min(car.speed, 130));

            // Move front and rear axles completely independently to calculate real turning arcs
            let fx = car.x + (car.wheelbase / 2) * Math.sin(car.angle);
            let fy = car.y - (car.wheelbase / 2) * Math.cos(car.angle);
            let rx = car.x - (car.wheelbase / 2) * Math.sin(car.angle);
            let ry = car.y + (car.wheelbase / 2) * Math.cos(car.angle);

            rx += car.speed * 0.04 * Math.sin(car.angle);
            ry -= car.speed * 0.04 * Math.cos(car.angle);

            fx += car.speed * 0.04 * Math.sin(car.angle + car.wheelAngle);
            fy -= car.speed * 0.04 * Math.cos(car.angle + car.wheelAngle);

            // Re-calculate body heading drift vectors
            car.x = (fx + rx) / 2;
            car.y = (fy + ry) / 2;
            car.angle = Math.atan2(fx - rx, ry - fy);

            // Update traffic nodes loops
            traffic.forEach(npc => {
                npc.y -= npc.speed * 0.5;
                if (npc.y < 0) npc.y = mapSize;
            });

            // 2. --- RENDERING FIRST-PERSON VIEW FROM THE CHARACTER'S EYES ---
            renderSceneView(ctx, canvas, car.angle, false);
            
            // 3. --- RENDERING REAL-TIME REAR MIRROR VIEW (Angles camera 180 degrees backward) ---
            renderSceneView(mCtx, mirrorCanvas, car.angle + Math.PI, true);

            document.getElementById('hud-speed').innerText = Math.round(Math.abs(car.speed));
        }

        function renderSceneView(renderContext, targetCanvas, viewAngle, isMirrorView) {
            renderContext.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
            
            let horizonY = targetCanvas.height * (isMirrorView ? 0.5 : 0.4);
            let cx = targetCanvas.width / 2;
            let fov = isMirrorView ? 200 : 450;

            // Draw Sky & Ground planes
            renderContext.fillStyle = '#223519'; // Grass terrain
            renderContext.fillRect(0, horizonY, targetCanvas.width, targetCanvas.height - horizonY);
            renderContext.fillStyle = isMirrorView ? '#5fa6d1' : '#7ec2eb'; // Sky layer
            renderContext.fillRect(0, 0, targetCanvas.width, horizonY);

            // --- 3D FIRST PERSON EYE COORDINATE PROJECTION FORMULA ---
            function project3D(worldX, worldY, worldZ) {
                // Places camera exactly where the driver's eyes are sitting on the left seat
                let headOffsetX = Math.sin(car.angle) * car.seatX;
                let headOffsetY = Math.cos(car.angle) * car.seatX;
                
                let relX = worldX - (car.x + headOffsetX);
                let relY = worldY - (car.y + headOffsetY);

                // Rotate surrounding world geometry directly around driver's orientation angle
                let rotX = relX * Math.cos(-viewAngle) - relY * Math.sin(-viewAngle);
                let rotY = relX * Math.sin(-viewAngle) + relY * Math.cos(-viewAngle);

                if (rotY >= -0.5) return null; // Clip geometry behind camera path

                let scale = fov / -rotY;
                return {
                    x: cx + rotX * scale,
                    y: horizonY + (worldZ - car.eyeHeight) * scale, // Locks view securely above map ground level
                    sz: scale
                };
            }

            // Draw Real 3D Grid Roads network (Twists, turns, junctions)
            renderContext.fillStyle = '#25252a';
            roads.forEach(r => {
                // Only render street paths close to the vehicle position coordinates
                if (Math.hypot(car.x - r.x, car.y - r.y) > 1500) return;

                let lf = project3D(r.x, r.y, 0);
                let rf = project3D(r.x + r.w, r.y, 0);
                let rn = project3D(r.x + r.w, r.y + r.h, 0);
                let ln = project3D(r.x, r.y + r.h, 0);

                if (lf && rf && rn && ln) {
                    renderContext.beginPath();
                    renderContext.moveTo(lf.x, lf.y); renderContext.lineTo(rf.x, rf.y);
                    renderContext.lineTo(rn.x, rn.y); renderContext.lineTo(ln.x, ln.y);
                    renderContext.fill();
                }
            });

            // Draw 3D Solid Skyscraper blocks sorted in space
            buildings.forEach(b => {
                if (Math.hypot(car.x - b.x, car.y - b.y) > 1200) return;

                let bBase = project3D(b.x, b.y, 0);
                if (bBase) {
                    let w = b.w * bBase.sz;
                    let h = b.alt * bBase.sz;
                    
                    renderContext.fillStyle = '#546e7a';
                    renderContext.fillRect(bBase.x - w/2, bBase.y - h, w, h);
                    renderContext.strokeStyle = '#37474f';
                    renderContext.strokeRect(bBase.x - w/2, bBase.y - h, w, h);
                }
            });

            // Draw 3D Traffic Obstacles
            traffic.forEach(npc => {
                let p = project3D(npc.x, npc.y, 0);
                if (p) {
                    let w = car.width * p.sz;
                    let h = car.height * p.sz;
                    renderContext.fillStyle = npc.color;
                    renderContext.fillRect(p.x - w/2, p.y - h, w, h);
                }
            });

            // 4. --- DRAW SEPARATE INTERACTIVE COCKPIT WHEEL (Only in main view) ---
            if (!isMirrorView && activeModel !== 'motorcycle') {
                renderContext.save();
                renderContext.translate(cx - 220, targetCanvas.height * 0.66); // Shifts wheel to left cockpit seat path
                renderContext.rotate(car.wheelAngle * 2.5);                   // Spins assembly on steering controls
                
                renderContext.lineWidth = 18;
                renderContext.strokeStyle = '#1d1d26';
                renderContext.beginPath(); renderContext.arc(0, 0, 90, 0, Math.PI * 2); renderContext.stroke();
                
                renderContext.fillStyle = '#111116';
                renderContext.fillRect(-80, -6, 160, 12);
                renderContext.fillRect(-6, 0, 12, 80);
                renderContext.restore();
            }
        }
    </script>
</body>
</html>
