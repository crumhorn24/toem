<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- iPhone 12 App Activation Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://flaticon.com">
    
    <title>iPhone Remote Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .app-card {
            background: linear-gradient(145deg, #161b26, #0f1420);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.1);
            max-width: 320px;
            width: 100%;
            border: 1px solid #1f293d;
        }
        
        /* This creates a built-in graphic icon using code */
        .icon-container {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #2563eb, #1d4ed8);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(37,99,235,0.4);
        }
        
        h1 { font-size: 22px; margin: 0 0 8px 0; color: #f3f4f6; font-weight: 600; }
        p { font-size: 14px; color: #9ca3af; margin: 0 0 30px 0; line-height: 1.4; }
        
        /* A realistic mobile control switch built with code */
        .action-btn {
            background: linear-gradient(180deg, #10b981, #059669);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
            transition: transform 0.1s ease;
        }
        .action-btn:active { 
            transform: scale(0.97);
            background: #059669; 
        }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- The visual icon graphic generated directly by the web browser -->
        <div class="icon-container">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
        </div>

        <h1>iPhone 12 Hub Active</h1>
        <p>Your hosted server file is online. Tap below to send the activation trigger.</p>
        
        <button class="action-btn" onclick="alert('Signal Transmitted to iPhone Link!')">Activate Signal</button>
    </div>

</body>
</html>
