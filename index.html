<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Open World Driving Simulator</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #06060c; color: white; user-select: none; }
        
        /* Menu Screen UI */
        #menu-view {
            position: absolute; width: 100vw; height: 100vh; z-index: 100;
            background: linear-gradient(135deg, #101026, #05050a);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 { font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; text-shadow: 0 0 10px rgba(0,210,255,0.3); }
        .menu-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 85%; max-width: 900px; }
        .vehicle-btn {
            background: #16162e; border: 2px solid #2d2d48; border-radius: 12px; height: 180px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
            cursor: pointer; transition: all 0.2s ease; color: white; font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
        }
        .vehicle-btn:hover { transform: translateY(-5px); border-color: #00d2ff; background: #20203f; }
        
        /* Simulation Viewport Screen */
        #game-view { display: none; position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Telemetry Dashboard Cluster Overlays */
        #dashboard-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 26vh;
            background: linear-gradient(to top, #0a0a0f 85%, #1c1c2b 100%);
            border-top: 5px solid #28283a; display: flex; align-items: center; justify-content: space-between;
            padding: 0 50px; box-sizing: border-box; z-index: 50;
        }
        .hud-panel { background: rgba(5,5,10,0.7); border: 2px solid #00d2ff; padding: 12px 25px; border-radius: 8px; font-family: monospace; font-size: 1.1rem; min-width: 160px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #controls-hint { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.75); padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; color: #aaa; z-index: 50; border: 1px solid #2d2d48; }
    </style>
</head>
<body>

    <!-- SELECTION MENU -->
    <div id="menu-view">
        <h1>Select Your Vehicle Model</h1>
        <div class="menu-container">
            <button class="vehicle-btn" onclick="launch3D('car')">🚗 Sedan Car</button>
            <button class="vehicle-btn" onclick="launch3D('lorry')">0 Heavy Lorry</button>
            <button class="vehicle-btn" onclick="launch3D('motorcycle')">🏍️ Motorcycle</button>
            <button class="vehicle-btn" onclick="launch3D('bus')">🚌 Transit Bus</button>
        </div>
    </div>

    <!-- SIMULATION CANVAS VIEWPORT -->
    <div id="game-view">
        <div id="controls-hint">W/S: Throttle/Brake | A/D: Turn Steering Axle</div>
        <canvas id="renderCanvas"></canvas>
        
        <!-- FIRST-PERSON DASHBOARD CONSOLE HUD -->
        <div id="dashboard-ui">
            <div class="hud-panel">
                GEAR MODEL: <span id="hud-model">-</span><br>
                STATUS: <span style="color: #39ff14;">ACTIVE</span>
            </div>
            <div class="hud-panel" style="font-size: 1.5rem; text-align: center; border-color: #ff0055;">
                <span id="hud-speed">0</span><br><span style="font-size: 0.75rem; color: #666;">KM/H</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        
        let keys = { w:0, a:0, s:0, d:0 };
        let activeModel = '';
        let simInterval;

        // --- REAL LIFE VEHICLE KINEMATICS PHYSICS SYSTEM ---
        let car = {
            x: 0, y: 1500,          // Position coordinates on map space
            speed: 0,
            angle: 0,              // Vehicle body facing rotation angle
            wheelAngle: 0,         // Angular turn lock of front wheel axle
            maxWheelAngle: 0.45,   // Real limits on steering tire angles
            wheelbase: 4.8,        // Distance between front and rear tracking wheels
            width: 2.5,
            height: 1.5,
            color: '#00d2ff',
            seatX: -0.65           // Sits the character POV inside the left seat area
        };

        // --- MASSIVE MAP LAYOUT STRUCTURE NODES ---
        let worldBlocks = [];
        let trafficCars = [];

        function resizeViewport() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.launch3D = function(type) {
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'block';
            document.getElementById('hud-model').innerText = type.toUpperCase();
            
            activeModel = type;
            // Adjust unique dimensional values matching your exact model choices
            if (type === 'lorry') { car.wheelbase = 12.0; car.width = 3.2; car.height = 4.0; car.color = '#ff007f'; }
            if (type === 'bus') { car.wheelbase = 14.0; car.width = 3.0; car.height = 3.5; car.color = '#ffaa00'; }
            if (type === 'motorcycle') { car.wheelbase = 2.4; car.width = 0.8; car.height = 1.2; car.color = '#39ff14'; car.seatX = 0; }

            resizeViewport();
            window.addEventListener('keydown', (e) => handleInputs(e, true));
            window.addEventListener('keyup', (e) => handleInputs(e, false));
            window.addEventListener('resize', resizeViewport);

            // GENERATE A A LOT BIGGER MAP INFRASTRUCTURE ENVIRONMENT NODES
            // Generates a massive city layout spanning 3000 meters filled with skyscraper structures
            for (let x = -1500; x <= 1500; x += 250) {
                for (let y = 0; y <= 3000; y += 250) {
                    if (Math.abs(x) < 30) continue; // Leaves space for the main straightaway highway lanes
                    
                    let blockHeight = 35 + Math.random() * 95;
                    worldBlocks.push({ x: x, y: y, z: 0, w: 30, l: 30, h: blockHeight });
                }
            }

            // Spawn computer traffic loops
            for(let i = 0; i < 8; i++) {
                trafficCars.push({ x: 8, y: 400 + (i * 300), speed: 4, color: '#555566' });
            }

            simInterval = setInterval(runMatrixPhysicsTick, 1000 / 60);
        };

        function handleInputs(e, isPressed) {
            let state = isPressed ? 1 : 0;
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = state;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = state;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = state;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = state;
        }

        function runMatrixPhysicsTick() {
            // 1. --- REAL AXLE STEERING MECHANICS (Ackermann Math Vector Transformations) ---
            if (keys.a) car.wheelAngle = Math.max(-car.maxWheelAngle, car.wheelAngle - 0.018);
            else if (keys.d) car.wheelAngle = Math.min(car.maxWheelAngle, car.wheelAngle + 0.018);
            else car.wheelAngle *= 0.82; // Wheels snap back straight cleanly on release

            if (keys.w) car.speed += 0.18;
            else if (keys.s) car.speed -= 0.45;
            else car.speed *= 0.96;
            car.speed = Math.max(-6, Math.min(car.speed, 115));

            // Tracking the positions of the front and rear axles independently
            let fx = car.x + (car.wheelbase / 2) * Math.sin(car.angle);
            let fy = car.y - (car.wheelbase / 2) * Math.cos(car.angle);
            let rx = car.x - (car.wheelbase / 2) * Math.sin(car.angle);
            let ry = car.y + (car.wheelbase / 2) * Math.cos(car.angle);

            // Shift axles relative to wheel rotation angles
            rx += car.speed * 0.04 * Math.sin(car.angle);
            ry -= car.speed * 0.04 * Math.cos(car.angle);

            fx += car.speed * 0.04 * Math.sin(car.angle + car.wheelAngle);
            fy -= car.speed * 0.04 * Math.cos(car.angle + car.wheelAngle);

            // Recombine positions to calculate vehicle body drift vectors and heading rotation values
            car.x = (fx + rx) / 2;
            car.y = (fy + ry) / 2;
            car.angle = Math.atan2(fx - rx, ry - fy);

            // Run computer traffic update loops
            trafficCars.forEach(npc => {
                npc.y += npc.speed * 0.4;
                if (npc.y > car.y + 600) npc.y = car.y - 600;
            });

            // 2. --- REAL-TIME 3D PERSPECTIVE ENVIRONMENT MATRIX RENDERING ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Ground and Sky Separations
            let horizonLineY = canvas.height * 0.4;
            let cx = canvas.width / 2;
            let fov = 400; // Focal zoom length

            ctx.fillStyle = '#22331c'; // Grass land plane
            ctx.fillRect(0, horizonLineY, canvas.width, canvas.height - horizonLineY);
            ctx.fillStyle = '#83c3eb'; // Cyan atmospheric sky
            ctx.fillRect(0, 0, canvas.width, horizonLineY);

            // --- PURE MATHEMATICAL 3D COORDINATE PERSPECTIVE PROJECTION ---
            function projectCoordinate3D(worldX, worldY, worldZ) {
                // Aligns camera to match driver eye coordinates inside left cabin seat layout bounds
                let headOffsetX = Math.sin(car.angle) * car.seatX;
                let headOffsetY = Math.cos(car.angle) * car.seatX;
                
                let relX = worldX - (car.x + headOffsetX);
                let relY = worldY - (car.y + headOffsetY);

                // Pivot world space around driver's orientation angle
                let rotX = relX * Math.cos(-car.angle) - relY * Math.sin(-car.angle);
                let rotY = relX * Math.sin(-car.angle) + relY * Math.cos(-car.angle);

                if (rotY >= -0.5) return null; // Behind camera plane viewport clipping loop

                let projectionScale = fov / -rotY;
                return {
                    x: cx + rotX * projectionScale,
                    y: horizonLineY + (worldZ - car.height * 0.85) * projectionScale, // Eye level height sits at dashboard seat parameters
                    sz: projectionScale
                };
            }

            // Draw Highway Asphalt Street Lines
            ctx.fillStyle = '#252528';
            ctx.beginPath();
            let lf = projectCoordinate3D(-20, car.y - 1200, 0);
            let rf = projectCoordinate3D(20, car.y - 1200, 0);
            let rn = projectCoordinate3D(20, car.y + 40, 0);
            let ln = projectCoordinate3D(-20, car.y + 40, 0);

            if (lf && rf && rn && ln) {
                ctx.moveTo(lf.x, lf.y); ctx.lineTo(rf.x, rf.y); ctx.lineTo(rn.x, rn.y); ctx.lineTo(ln.x, ln.y);
                ctx.fill();
            }

            // Draw Yellow Lane Dividers
            ctx.fillStyle = '#ffbb00';
            for (let markY = Math.floor(car.y - 1000); markY < car.y + 200; markY += 80) {
                let m1 = projectCoordinate3D(0, markY, 0);
                if (m1) ctx.fillRect(m1.x - m1.sz * 0.1, m1.y, m1.sz * 0.2, m1.sz * 5);
            }

            // Draw 3D Solid Scraper Blocks sorted by distance metrics to display layering depth
            worldBlocks.forEach(b => {
                // Skips rendering items too far behind camera viewport
                if (Math.abs(b.y - car.y) > 1400) return;

                let bBase = projectCoordinate3D(b.x, b.y, 0);
                if (bBase) {
                    let w = b.w * bBase.sz;
                    let h = b.h * bBase.sz;
                    
                    ctx.fillStyle = '#6d8896';
                    ctx.fillRect(bBase.x - w/2, bBase.y - h, w, h);
                    ctx.strokeStyle = '#4b5e68';
                    ctx.strokeRect(bBase.x - w/2, bBase.y - h, w, h);
                }
            });

            // Draw Traffic NPC Vehicles scaling smoothly matching positions
            trafficCars.forEach(npc => {
                let p = projectCoordinate3D(npc.x, npc.y, 0);
                if (p) {
                    let w = car.width * p.sz;
                    let h = car.height * p.sz;
                    ctx.fillStyle = npc.color;
                    ctx.fillRect(p.x - w / 2, p.y - h, w, h);
                    
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillRect(p.x - w / 2 + 3, p.y - h + 2, w - 6, h * 0.25);
                }
            });

            // Draw Your Left-Hand Wheel Assembly & dashboard frame console overlay controls
            if (activeModel !== 'motorcycle') {
                ctx.save();
                ctx.translate(cx - 240, canvas.height * 0.68); // Displaces steering wheel exactly on left cockpit axis parameters
                ctx.rotate(car.wheelAngle * 2.8);              // Natural rotation locks multiplier
                
                ctx.lineWidth = 20;
                ctx.strokeStyle = '#18181f';
                ctx.beginPath(); ctx.arc(0, 0, 95, 0, Math.PI * 2); ctx.stroke();
                
                ctx.fillStyle = '#111116';
                ctx.fillRect(-85, -6, 170, 12);
                ctx.fillRect(-6, 0, 12, 85);
                ctx.restore();
            }

            document.getElementById('hud-speed').innerText = Math.round(Math.abs(car.speed));
        }
    </script>
</body>
</html>
